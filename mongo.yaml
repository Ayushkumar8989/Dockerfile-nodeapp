
services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: delta_admin
      MONGO_INITDB_ROOT_PASSWORD: delta_password

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    restart: always
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: delta_admin
      ME_CONFIG_BASICAUTH_PASSWORD: delta_password
      ME_CONFIG_MONGODB_URL: mongodb://delta_admin:delta_password@mongo:27017/?authSource=admin
    depends_on:
      - mongo
